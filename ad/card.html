<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Source Serif 4"; src: url("fonts/SourceSerif4-SemiBold.otf") format("opentype"); font-weight: 600; font-style: normal; font-display: block; }
  @font-face { font-family: "Source Serif 4"; src: url("fonts/SourceSerif4-Bold.otf") format("opentype"); font-weight: 700; font-style: normal; font-display: block; }
  @font-face { font-family: "Source Serif 4"; src: url("fonts/SourceSerif4-Regular.otf") format("opentype"); font-weight: 400; font-style: normal; font-display: block; }
  @font-face { font-family: "Source Serif 4"; src: url("fonts/SourceSerif4-Italic.otf") format("opentype"); font-weight: 400; font-style: italic; font-display: block; }
  @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono-Medium.ttf") format("truetype"); font-weight: 500; font-style: normal; font-display: block; }
  * { margin: 0; padding: 0; }
  html, body { overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
  <!-- 1080x1350 (4:5) recruitment card, rendered into a 2x buffer for crisp text. -->
  <canvas id="c" width="2160" height="2700"></canvas>
  <script>
    const W = 1080, H = 1350, CX = W / 2;
    const ctx = document.getElementById('c').getContext('2d');
    ctx.scale(2, 2);
    const q = new URLSearchParams(location.search);
    const THEME = q.get('theme') || 'light';
    const LIGHT = THEME !== 'dark';
    const BG    = THEME === 'paper' ? '#FBF9F3' : (LIGHT ? '#FAF3DC' : '#1C1815');
    const PAPER = LIGHT ? '#23201C' : '#F3EFE6';
    const DIM   = LIGHT ? '#5C5547' : '#B7AD9C';
    const FNT   = LIGHT ? '#9A917F' : '#8A8175';
    const OX    = LIGHT ? '#7D2A1A' : '#D6816A';
    const HAIR  = LIGHT ? 'rgba(28,24,21,0.18)' : 'rgba(243,239,230,0.20)';
    const SERIF = '"Source Serif 4"', MONO = '"JetBrains Mono"';

    function text(s, x, y, font, color, align, ls = 0) {
      ctx.fillStyle = color; ctx.font = font; ctx.textAlign = align;
      ctx.textBaseline = 'alphabetic'; ctx.letterSpacing = ls + 'px';
      ctx.fillText(s, x, y);
    }
    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
    }
    const ICON = new Image(), QR = new Image();
    function icon(cx, cy, size) {
      const x = cx - size/2, yy = cy - size/2, r = size*0.22;
      ctx.save();
      ctx.shadowColor = LIGHT ? 'rgba(45,33,22,0.20)' : 'rgba(0,0,0,0.45)';
      ctx.shadowBlur = size*0.07; ctx.shadowOffsetY = size*0.03;
      roundRect(x, yy, size, size, r); ctx.fillStyle = '#FAF3DC'; ctx.fill();
      ctx.restore();
      ctx.save(); roundRect(x, yy, size, size, r); ctx.clip();
      ctx.drawImage(ICON, x, yy, size, size); ctx.restore();
    }

    function draw() {
      ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);

      // --- header: icon + wordmark ---
      icon(CX, 150, 124);
      text('Perpenda', CX, 268, '600 60px ' + SERIF, PAPER, 'center');

      // --- headline ---
      text('Become a tester', CX, 372, '700 76px ' + SERIF, PAPER, 'center');
      text('Help put Perpenda on the Play Store.', CX, 424, 'italic 400 34px ' + SERIF, DIM, 'center');
      ctx.fillStyle = OX; ctx.fillRect(CX - 70, 452, 140, 5);

      // --- the ask (three quick lines) ---
      const bx = 250; let y = 540;
      const rows = [
        ['Android 8+', 'install it once'],
        ['14 days', 'open it now & then'],
        ['The group', 'drop the odd bit of feedback'],
      ];
      for (const [a, b] of rows) {
        ctx.fillStyle = OX; ctx.beginPath(); ctx.arc(bx, y - 10, 6, 0, 7); ctx.fill();
        text(a, bx + 28, y, '600 32px ' + SERIF, PAPER, 'left');
        text('— ' + b, bx + 28 + ctx.measureText(a).width + 14, y, '400 32px ' + SERIF, DIM, 'left');
        y += 58;
      }
      text('Free  ·  no ads  ·  no trackers', CX, y + 14, '500 26px ' + MONO, FNT, 'center', 2);

      // --- QR in a framed plate ---
      const qrSize = 360, qx = CX - qrSize/2, qy = 800;
      const pad = 26;
      ctx.save();
      ctx.shadowColor = LIGHT ? 'rgba(45,33,22,0.16)' : 'rgba(0,0,0,0.4)';
      ctx.shadowBlur = 30; ctx.shadowOffsetY = 8;
      roundRect(qx - pad, qy - pad, qrSize + 2*pad, qrSize + 2*pad, 28);
      ctx.fillStyle = LIGHT ? '#FFFDF7' : '#262019'; ctx.fill();
      ctx.restore();
      ctx.drawImage(QR, qx, qy, qrSize, qrSize);

      // --- CTA under the QR ---
      text('Scan to join the WhatsApp group', CX, qy + qrSize + 90, '600 38px ' + SERIF, PAPER, 'center');
      text('perpenda.com', CX, H - 70, '500 26px ' + MONO, FNT, 'center', 3);
    }

    async function boot() {
      try { await Promise.all(['700 76px "Source Serif 4"','600 60px "Source Serif 4"','400 34px "Source Serif 4"','500 26px "JetBrains Mono"'].map(f => document.fonts.load(f))); } catch (e) {}
      await document.fonts.ready;
      await Promise.all([
        new Promise(res => { ICON.onload = ICON.onerror = res; ICON.src = 'icon-512.png'; }),
        new Promise(res => { QR.onload = QR.onerror = res; QR.src = (q.get('qr') || 'qr_whatsapp_light.png'); }),
      ]);
      draw();
      window.__ready = true;
    }
    boot();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Perpenda — Ad</title>
<style>
  @font-face { font-family: "Source Serif 4"; src: url("fonts/SourceSerif4-Regular.otf") format("opentype"); font-weight: 400; font-style: normal; font-display: block; }
  @font-face { font-family: "Source Serif 4"; src: url("fonts/SourceSerif4-Italic.otf") format("opentype"); font-weight: 400; font-style: italic; font-display: block; }
  @font-face { font-family: "Source Serif 4"; src: url("fonts/SourceSerif4-SemiBold.otf") format("opentype"); font-weight: 600; font-style: normal; font-display: block; }
  @font-face { font-family: "Source Serif 4"; src: url("fonts/SourceSerif4-Bold.otf") format("opentype"); font-weight: 700; font-style: normal; font-display: block; }
  @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono-Medium.ttf") format("truetype"); font-weight: 500; font-style: normal; font-display: block; }
  * { margin: 0; padding: 0; }
  html, body { background: #1C1815; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
  <canvas id="c" width="3840" height="2160"></canvas>
  <script>
    const W = 3840, H = 2160, CX = W / 2;
    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');

    // ── Theme: dark ink (default) or light cream/paper (?theme=light) ──
    const LIGHT = location.search.indexOf('light') !== -1;
    const BG        = LIGHT ? '#FAF3DC' : '#1C1815';
    const PAPER     = LIGHT ? '#23201C' : '#F3EFE6'; // primary text
    const PAPER_DIM = LIGHT ? '#5C5547' : '#B7AD9C'; // secondary text
    const PAPER_FNT = LIGHT ? '#9A917F' : '#8A8175'; // faint text
    const OX        = LIGHT ? '#7D2A1A' : '#D6816A'; // oxblood accent
    const SAGE      = LIGHT ? '#5C6B5D' : '#9DB39B'; // "settled" green
    const HAIR      = LIGHT ? 'rgba(28,24,21,0.14)' : 'rgba(243,239,230,0.16)';

    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const easeOut = x => 1 - Math.pow(1 - x, 3);
    const easeInOut = x => x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3)/2;

    // window fade: in at inS over inD, out at outS over outD; rise on entry
    function win(t, inS, outS, inD = 0.7, outD = 0.5, rise = 28) {
      const pi = clamp((t - inS) / inD, 0, 1);
      const po = clamp((t - outS) / outD, 0, 1);
      const ei = easeOut(pi);
      return { o: ei * (1 - easeInOut(po)), ty: (1 - ei) * rise };
    }

    function text(str, x, y, font, color, align, alpha, ls = 0) {
      ctx.save();
      ctx.globalAlpha = clamp(alpha, 0, 1);
      ctx.fillStyle = color;
      ctx.font = font;
      ctx.textAlign = align;
      ctx.textBaseline = 'alphabetic';
      ctx.letterSpacing = ls + 'px';
      ctx.fillText(str, x, y);
      ctx.restore();
    }

    // Official app icon (docs/brand/perpenda-icon-512.png) drawn as a rounded tile.
    const ICON = new Image();
    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }
    function mark(cx, cy, size, alpha) {
      if (!ICON.complete || !ICON.naturalWidth) return;
      const x = cx - size / 2, y = cy - size / 2, r = size * 0.22;
      // On the cream theme the tile shares the page colour, so cast a soft
      // shadow to lift it off the background and read as an app icon.
      if (LIGHT) {
        ctx.save();
        ctx.globalAlpha = clamp(alpha, 0, 1);
        ctx.shadowColor = 'rgba(45,33,22,0.20)';
        ctx.shadowBlur = size * 0.06;
        ctx.shadowOffsetY = size * 0.025;
        roundRect(x, y, size, size, r);
        ctx.fillStyle = '#FAF3DC';
        ctx.fill();
        ctx.restore();
      }
      ctx.save();
      ctx.globalAlpha = clamp(alpha, 0, 1);
      roundRect(x, y, size, size, r);
      ctx.clip();
      ctx.drawImage(ICON, x, y, size, size);
      ctx.restore();
      if (LIGHT) {
        ctx.save();
        ctx.globalAlpha = clamp(alpha, 0, 1);
        roundRect(x, y, size, size, r);
        ctx.strokeStyle = 'rgba(28,24,21,0.10)';
        ctx.lineWidth = size * 0.006;
        ctx.stroke();
        ctx.restore();
      }
    }

    function rule(cx, y, w, alpha, color = OX, h = 5) {
      ctx.save();
      ctx.globalAlpha = clamp(alpha, 0, 1);
      ctx.fillStyle = color;
      ctx.fillRect(cx - w/2, y, w, h);
      ctx.restore();
    }

    const SERIF = '"Source Serif 4"';
    const MONO  = '"JetBrains Mono"';

    // ── Storyboard (seconds) ──
    function render(t) {
      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, W, H);

      // SCENE A — brand open (0 – 3.6)
      {
        const f = win(t, 0.7, 3.0, 0.9, 0.5, 30);
        if (f.o > 0.001) {
          text('Perpenda', CX, H/2 + 40 + f.ty, '600 210px ' + SERIF, PAPER, 'center', f.o);
          const grow = easeInOut(clamp((t - 0.6)/1.1, 0, 1));
          rule(CX, H/2 + 150 + f.ty, 620 * grow, f.o, OX, 6);
        }
      }

      // SCENE B — the stakes (3.6 – 7.6)
      {
        const e = win(t, 3.9, 6.9, 0.6, 0.5);
        text('FOR PRODUCT TEAMS', CX, H/2 - 150 + e.ty, '500 42px ' + MONO, OX, 'center', e.o, 16);
        const h = win(t, 4.1, 6.9, 0.7, 0.5, 34);
        text('The AI calls are', CX, H/2 + 30 + h.ty, '600 168px ' + SERIF, PAPER, 'center', h.o);
        text('yours now.',       CX, H/2 + 230 + h.ty, '600 168px ' + SERIF, PAPER, 'center', h.o);
      }

      // SCENE C — the loop (7.6 – 12.0)
      {
        const lines = [
          ['Read the bite.',  7.9],
          ['Make the call.',  9.0],
          ['Get calibrated.', 10.1],
        ];
        const baseY = H/2 - 190;
        let any = 0;
        lines.forEach(([s, st], i) => {
          const f = win(t, st, 11.4, 0.6, 0.5, 26);
          any = Math.max(any, f.o);
          const active = i === 2 ? OX : PAPER;
          text(s, CX, baseY + i * 195 + f.ty, '600 150px ' + SERIF, active, 'center', f.o);
        });
      }

      // SCENE D — calibration proof (12.0 – 16.2)
      {
        const head = win(t, 12.2, 15.6, 0.6, 0.5);
        text('CALIBRATE', CX, H/2 - 360 + head.ty, '500 42px ' + MONO, OX, 'center', head.o, 16);
        text('Criterion by criterion.', CX, H/2 - 200 + head.ty, '600 120px ' + SERIF, PAPER, 'center', head.o);

        const rows = [
          ['Names the unit — tokens, not requests', 'SOLID',   true,  12.7],
          ['Accounts for non-English inflation',         'SOLID',   true,  13.1],
          ['States a defensible per-call number',        'MISSING', false, 13.5],
        ];
        const left = CX - 1180, right = CX + 1180;
        rows.forEach(([label, tag, ok, st], i) => {
          const f = win(t, st, 15.6, 0.55, 0.5, 22);
          if (f.o <= 0.001) return;
          const y = H/2 + 30 + i * 165 + f.ty;
          ctx.save();
          ctx.globalAlpha = f.o;
          // divider above each row
          ctx.strokeStyle = HAIR; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(left, y - 78); ctx.lineTo(right, y - 78); ctx.stroke();
          // check / cross
          ctx.strokeStyle = ok ? SAGE : OX;
          ctx.lineWidth = 8; ctx.lineCap = 'round';
          const mx = left + 36, my = y - 36;
          ctx.beginPath();
          if (ok) { ctx.moveTo(mx-24, my); ctx.lineTo(mx-6, my+20); ctx.lineTo(mx+30, my-26); }
          else    { ctx.moveTo(mx-22, my-22); ctx.lineTo(mx+26, my+26); ctx.moveTo(mx+26, my-22); ctx.lineTo(mx-22, my+26); }
          ctx.stroke();
          ctx.restore();
          text(label, left + 110, y, '400 62px ' + SERIF, PAPER, 'left', f.o);
          text(tag, right, y - 4, '500 40px ' + MONO, ok ? SAGE : OX, 'right', f.o * 0.95, 6);
        });
      }

      // SCENE E — no vanity score (16.2 – 19.0)
      {
        const a = win(t, 16.5, 18.4, 0.6, 0.5, 30);
        text('No vanity score.', CX, H/2 - 10 + a.ty, '600 168px ' + SERIF, PAPER, 'center', a.o);
        const b = win(t, 16.9, 18.4, 0.6, 0.5, 30);
        text('Just where you actually stand.', CX, H/2 + 150 + b.ty, '400 78px ' + SERIF, PAPER_DIM, 'center', b.o);
      }

      // SCENE F — end card (19.0 – 23.0)
      {
        const A = 19.0;
        if (t >= A) {
          const m  = win(t, 19.2, 99, 0.8, 0.5, 24);
          const w  = win(t, 19.6, 99, 0.8, 0.5, 24);
          const tg = win(t, 20.6, 99, 0.8, 0.5, 24);
          const pl = win(t, 21.4, 99, 0.8, 0.5, 24);
          const ms = 0.92 + 0.08 * easeOut(clamp((t - 19.2)/0.7, 0, 1));
          mark(CX, H/2 - 320, 330 * ms, m.o);
          text('Perpenda', CX, H/2 + 90 + w.ty, '600 200px ' + SERIF, PAPER, 'center', w.o);
          const grow = easeOut(clamp((t - 20.5)/0.9, 0, 1));
          rule(CX, H/2 + 185, 640 * grow, tg.o, OX, 5);
          text('Decision-grade AI fluency.', CX, H/2 + 360 + tg.ty, 'italic 400 84px ' + SERIF, PAPER_DIM, 'center', tg.o);
          text('ON GOOGLE PLAY', CX, H/2 + 620 + pl.ty, '500 44px ' + MONO, PAPER_FNT, 'center', pl.o, 18);
        }
      }
    }

    // Animation loop driven by rAF timestamp (deterministic under capture shim).
    function frame(ts) { render((ts || 0) / 1000); requestAnimationFrame(frame); }

    async function boot() {
      const faces = [
        '600 210px "Source Serif 4"', '700 300px "Source Serif 4"',
        '400 62px "Source Serif 4"',  'italic 400 84px "Source Serif 4"',
        '500 44px "JetBrains Mono"',
      ];
      try { await Promise.all(faces.map(f => document.fonts.load(f))); } catch (e) {}
      await document.fonts.ready;
      await new Promise(res => { ICON.onload = ICON.onerror = res; ICON.src = 'icon-512.png'; });
      render(0);
      window.__ready = true;
      requestAnimationFrame(frame);
    }
    boot();
  </script>
</body>
</html>

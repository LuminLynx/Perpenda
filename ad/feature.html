<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Source Serif 4"; src: url("fonts/SourceSerif4-SemiBold.otf") format("opentype"); font-weight: 600; font-style: normal; font-display: block; }
  @font-face { font-family: "Source Serif 4"; src: url("fonts/SourceSerif4-Regular.otf") format("opentype"); font-weight: 400; font-style: normal; font-display: block; }
  @font-face { font-family: "Source Serif 4"; src: url("fonts/SourceSerif4-Italic.otf") format("opentype"); font-weight: 400; font-style: italic; font-display: block; }
  @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono-Medium.ttf") format("truetype"); font-weight: 500; font-style: normal; font-display: block; }
  * { margin: 0; padding: 0; }
  html, body { overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
  <!-- Play feature graphic is 1024x500; render the layout into a 2x buffer for crisp text. -->
  <canvas id="c" width="2048" height="1000"></canvas>
  <script>
    const W = 1024, H = 500;
    const ctx = document.getElementById('c').getContext('2d');
    ctx.scale(2, 2);
    const q = new URLSearchParams(location.search);
    const V = q.get('v') || 'a';
    const THEME = q.get('theme') || 'light';        // light (cream) | paper (near-white) | dark
    const LIGHT = THEME !== 'dark';

    const BG    = THEME === 'paper' ? '#FBF9F3' : (LIGHT ? '#FAF3DC' : '#1C1815');
    const PAPER = LIGHT ? '#23201C' : '#F3EFE6';
    const DIM   = LIGHT ? '#5C5547' : '#B7AD9C';
    const FNT   = LIGHT ? '#9A917F' : '#8A8175';
    const OX    = LIGHT ? '#7D2A1A' : '#D6816A';
    const SERIF = '"Source Serif 4"', MONO = '"JetBrains Mono"';

    function text(s, x, y, font, color, align, ls = 0) {
      ctx.fillStyle = color; ctx.font = font; ctx.textAlign = align;
      ctx.textBaseline = 'alphabetic'; ctx.letterSpacing = ls + 'px';
      ctx.fillText(s, x, y);
    }
    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }
    const ICON = new Image();
    function icon(cx, cy, size) {
      const x = cx - size/2, yy = cy - size/2, r = size*0.22;
      ctx.save();
      ctx.shadowColor = LIGHT ? 'rgba(45,33,22,0.22)' : 'rgba(0,0,0,0.45)';
      ctx.shadowBlur = size*0.07; ctx.shadowOffsetY = size*0.03;
      roundRect(x, yy, size, size, r); ctx.fillStyle = '#FAF3DC'; ctx.fill();
      ctx.restore();
      ctx.save(); roundRect(x, yy, size, size, r); ctx.clip();
      ctx.drawImage(ICON, x, yy, size, size); ctx.restore();
    }

    function draw() {
      ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);

      // Horizontal lockup: app icon on the left, wordmark + tagline on the right.
      const iconCx = 200, cy = H / 2;
      icon(iconCx, cy, 210);

      const tx = 350; // left edge of the text block
      text('Perpenda', tx, cy - 36, '600 96px ' + SERIF, PAPER, 'left');
      if (V === 'a') {
        text('Decision-grade AI fluency.', tx, cy + 42, 'italic 400 44px ' + SERIF, DIM, 'left');
      } else {
        text('The AI calls are yours now.', tx, cy + 42, 'italic 400 44px ' + SERIF, DIM, 'left');
      }
      ctx.fillStyle = OX; ctx.fillRect(tx + 2, cy + 72, 150, 6);
      text('ONE TRADE-OFF AT A TIME', tx + 2, cy + 120, '500 22px ' + MONO, FNT, 'left', 6);
    }

    async function boot() {
      try { await Promise.all(['600 96px "Source Serif 4"','400 44px "Source Serif 4"','500 22px "JetBrains Mono"'].map(f => document.fonts.load(f))); } catch (e) {}
      await document.fonts.ready;
      await new Promise(res => { ICON.onload = ICON.onerror = res; ICON.src = 'icon-512.png'; });
      draw();
      window.__ready = true;
    }
    boot();
  </script>
</body>
</html>
